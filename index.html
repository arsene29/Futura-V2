 const T={tap:[[1200,.03,'sine',,.08]],tick:[[1800,.025,'triangle',,.1]],ok:[[520,.06],[780,.1]],open:[[400,.14,'sine',900],[900,.08]],close:[[800,.12,'sine',350]],

 hold:[[200,.1],[260,.1]],drop:[[340,.05],[170,.12]],done:[[392,.06],[523,.06],[659,.06],[784,.22]],lvl:[[523,.08],[659,.08],[784,.08],[1047,.08],[784,.08],[1047,.4,'triangle']]};
 let t=AC.currentTime;(T[n]||[]).forEach(([f,d,ty,to,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.16,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.85})}catch(e){}}

 while(x<w){const bw=22+r()*34,bh=h*(.3+r()*.55);o+=`<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" fill="${r()>.5?'#1c1c22':'#2a2a32'}"/>`;

 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${o}</svg>`}
(function(){let g='',c='';for(let i=-12;i<=12;i++)g+=`<line x1="200" y1="118" x2="${200+i*70}" y2="235"/>`;for(let k=1;k<7;k++){const y=118+k*k*2.4;g+=`<line x1="0" y1="${y}" x2="400" y2="${y}"/>`}

 $('#sk1').innerHTML=`<svg viewBox="0 0 400 235" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06124a"/><stop offset=".65" stop-color="#1b4fd8"/><stop offset="1" stop-color="#5df0ff"/></linearGradient><radialGradient id="g2"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#9ff6ff"/><stop offset="1" stop-color="#5df0ff" stop-opacity="0"/></radialGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#5df0ff" stop-opacity=".25"/></linearGradient></defs><rect width="400" height="235" fill="url(#g1)"/><circle cx="290" cy="92" r="74" fill="url(#g2)"/><g stroke="#bff9ff" stroke-opacity=".4" stroke-width="1">${g}</g>${c}</svg>`})();

$('#logo').innerHTML='<span class="chrome">FUTURA</span>';$('#h-st').innerHTML=rn('Stats');drawAv();

function drawCal(){
 const y=cm.getFullYear(),m=cm.getMonth();$('#mt').innerHTML=rn(cm.toLocaleString('en',{month:'long'})+' '+y);
 let h=['S','M','T','W','T','F','S'].map(d=>`<div class="w">${d}</div>`).join('');
 const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)h+='<div class="dc x"></div>';
 for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d)),E=S.events.filter(e=>e.date===k),T=S.tasks.filter(t=>t.date===k),im=E.concat(T).some(x=>x.imp&&!x.done);
  h+=`<div class="dc ${k===today()?'td':''} ${k===sel?'sel':''} ${im?'imp':''}" data-d="${k}">${d}${im?'<span class="st">★</span>':''}<div class="dots">${'<i class="dot"></i>'.repeat(Math.min(E.length,3))}${'<i class="dot k"></i>'.repeat(Math.min(T.length,3))}</div></div>`}

 const evs=S.events.filter(e=>e.date===sel).sort((a,b)=>(b.imp?1:0)-(a.imp?1:0)||(a.time||'').localeCompare(b.time||'')),tks=S.tasks.filter(t=>t.date===sel).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(b.imp?1:0)-(a.imp?1:0));

 $('#ae').onclick=()=>itemForm('e');$('#at').onclick=()=>itemForm('t');

}

function itemForm(kind,it){const isE=kind==='e',n=!it;it=it||{title:'',date:sel,time:'09:00',notes:'',imp:false};let imp=!!it.imp;
 modal(`<span class="lab">${n?'NEW':'EDIT'} ${isE?'EVENT':'TASK'}</span><input id="f1" placeholder="${isE?'Event':'Task'} name" value="${esc(it.title)}">${isE?'':'<button class="big" id="sg">💡 SUGGEST A TASK</button>'}<input id="f2" type="date" value="${it.date}">${isE?`<input id="f3" type="time" value="${it.time||''}">`:''}<input id="f4" placeholder="Notes (optional)" value="${esc(it.notes||'')}"><button class="big imptog ${imp?'on':''}" id="fi">★ MARK AS IMPORTANT</button><button class="big pri" id="ok">${n?'ADD':'SAVE'}</button>`);

function showItem(kind,id){const isE=kind==='e',it=(isE?S.events:S.tasks).find(x=>x.id===id);if(!it)return;
 modal(`<div class="row"><span class="lab">${isE?'EVENT':'TASK'}</span><span class="sp"></span>${it.imp?'<span class="imps">★ IMPORTANT</span>':''}</div><div style="font:800 20px Orbitron;margin:14px 0 6px">${esc(it.title)}</div>

 let s=Math.floor((evTime(nx)-now)/1000);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;

 if(!(S.md[y]>0||S.fz[y])&&(S.md[ymd(d2)]>0||S.fz[ymd(d2)])&&S.freeze>0){S.freeze--;S.fz[y]=1;froze=1}
 const rew=10+5*(Math.min(S.lg.n,7)-1),w=[...S.skills].sort((a,b)=>lvl(a.xp).l-lvl(b.xp).l||a.xp-b.xp)[0];let got=0;
 if(w)got=gainXP(w,rew,'🎁 Login');if(S.lg.n%7===0)S.freeze=Math.min(3,S.freeze+1);
 S.lg.last=t;save();return{n:S.lg.n,got,w:w&&w.name,froze,wk:S.lg.n%7===0}}
function showLogin(i){const pos=(i.n-1)%7+1;modal(`<span class="lab">DAILY LOGIN</span><div class="mt" style="margin-top:10px">Day ${i.n} · +${i.got} XP${i.w?' to '+esc(i.w):''}</div><div class="week">${[1,2,3,4,5,6,7].map(k=>`<div class="wd ${k<=pos?'on':''}">${k===7?'🎁':k}</div>`).join('')}</div>${i.froze?'<div class="em">🧊 A streak freeze saved your streak yesterday.</div>':''}<div class="em">${i.wk?'Day 7 reward: +1 🧊 streak freeze!':'Reach day 7 for a free 🧊 streak freeze. Miss a day and the login streak restarts.'}</div><button class="big pri" id="lgb">CLAIM</button>`);$('#lgb').onclick=()=>{sfx('star');closeM();avSig='';updBadge()}}
const doneCount=()=>S.log.filter(g=>!/🎁|All clear/.test(g.c||'')&&g.x>0).length;
const BADGES=[['spark','⚡','First Spark','Finish your first activity',()=>doneCount()>=1],['ten','🏁','Getting Serious','Finish 10 activities',()=>doneCount()>=10],['fifty','🏆','Fifty Club','Finish 50 activities',()=>doneCount()>=50],
['s3','🔥','3-Day Streak','Mission streak of 3',()=>streak()>=3],['s7','🌟','Week Warrior','Mission streak of 7',()=>streak()>=7],['s30','👑','Monthly Legend','Mission streak of 30',()=>streak()>=30],
['clear','✅','All Clear','Finish all 3 missions in a day',()=>Object.values(S.md).some(v=>v>=3)],['lvl5','🚀','Rising','Reach lifetime Lv 5 in a skill',()=>S.skills.some(s=>lvl(S.life[s.name]||s.xp).l>=5)],
['bal','⚖️','Balanced','3+ skills at Lv 3 this month',()=>S.skills.length>=3&&S.skills.every(s=>lvl(s.xp).l>=3)],['chips','💿','Collector','Create 5 chips',()=>S.boxes.length>=5],
['imp','⭐','Priority Mode','Finish an important task',()=>S.tasks.some(t=>t.done&&t.imp)],['honor','🎓','Honor Roll','Earn an A or S in a season',()=>S.seasons.some(e=>e.grade==='A'||e.grade==='S')],['loyal','🎁','Loyal','7-day login streak',()=>S.lg.n>=7]];
function checkBadges(){let c=0;BADGES.forEach(([id,ic,n,d,f])=>{if(!S.badges[id]&&f()){S.badges[id]=today();save();const k=c++;if(k<3)setTimeout(()=>{sfx('star');buzz([20,30,20]);toast(`🏅 Badge: ${n}`)},k*2400)}})}
function badgesHTML(){const n=Object.keys(S.badges).length;return `<div class="card"><div class="row"><span class="lab">BADGES</span><span class="sp"></span><b style="font:800 13px Orbitron">${n}/${BADGES.length}</b></div><div class="bgs">${BADGES.map(([id,ic,nm,d])=>`<div class="bg ${S.badges[id]?'on':''}"><div class="bi">${S.badges[id]?ic:'🔒'}</div><div class="bn">${nm}</div><div class="bd2">${esc(d)}</div></div>`).join('')}</div></div>`}
let pickH=null;const HINT='Tap a chip to edit it. Hold one for 1 second until it shakes, then drag it onto the schedule.';
function setHint(){const e=document.querySelector('#inv .em');if(e)e.textContent=pickH!=null?`Tap a chip to schedule it at ${fh(pickH)}.`:HINT}
function pickChip(box){const s=pickH;pickH=null;$('#inv').classList.remove('open');setHint();if(D().some(b=>b.start<s+1&&b.end>s)){sfx('err');toast('That slot is taken');return}
 D().push({id:uid(),name:box.name,skill:box.skill,icon:box.icon,color:box.color,bid:box.id,start:s,end:s+1,done:false});save();sfx('drop');buzz(12);drawGrid()}
$('#grid').addEventListener('click',e=>{if(e.target.closest('.blk'))return;const r=$('#grid').getBoundingClientRect(),row=Math.floor((e.clientY-r.top)/H);if(row<0||row>=NR)return;const s=H0+row;
 if(D().some(b=>b.start<s+1&&b.end>s))return;pickH=s;drawInv();setHint();sfx('open');$('#inv').classList.remove('away');$('#inv').classList.add('open')});
$('#qa').onclick=()=>{modal('<span class="lab">QUICK ADD</span><button class="big pri" id="q1">📅 EVENT</button><button class="big" id="q2">✅ TASK</button>');$('#q1').onclick=()=>itemForm('e');$('#q2').onclick=()=>itemForm('t')};
setHint();const lgi=dailyCheck();
if(lgi&&!firstRun){if(S.pend)toast(`🎁 Login +${lgi.got} XP`);else setTimeout(()=>showLogin(lgi),1300)}
checkBadges();setInterval(checkBadges,2000);avSig='';updBadge();
drawCal();tick();drawGrid();
</script></body></html>
